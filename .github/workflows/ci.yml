name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill:
    name: Skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Script syntax
        run: for f in skill/scripts/*.mjs; do node --check "$f"; done

  helper:
    name: Helper (cli-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npm run typecheck
      - run: npm run build
