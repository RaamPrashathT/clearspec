name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skill:
    name: Skill checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Script syntax
        run: |
          for f in plugins/clearspec/skills/clearspec/scripts/*.mjs evals/run-persona.mjs scripts/*.mjs; do
            node --check "$f"
          done
      - name: Plugin and marketplace manifests are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/clearspec/.claude-plugin/plugin.json','utf8'))"
      - name: Eval fixtures pass the check script
        run: node scripts/check-fixtures.mjs
